name: groestlcoin-core
version: '30.2'
summary: Fully validating Groestlcoin peer-to-peer network node, wallet and GUI
description: |
  Groestlcoin Core connects to the Groestlcoin peer-to-peer network to download and
  fully validate blocks and transactions. It also includes a wallet and
  graphical user interface.

grade: stable
confinement: strict
base: core22

apps:
  daemon:
    command: bin/groestlcoind
    plugs: [home,removable-media, network, network-bind]
    environment:
      # Override HOME so the datadir is located at
      # ~/snap/groestlcoin-core/common/.groestlcoin/ instead of
      # ~/snap/groestlcoin-core/current/.groestlcoin/, and each new version of the
      # snap won't have a different data directory:
      # https://docs.snapcraft.io/environment-variables/7983
      HOME: $SNAP_USER_COMMON
  qt:
    command: bin/desktop-launch groestlcoin-qt
    plugs: [home,removable-media, network, network-bind, desktop, x11, unity7]
    environment:
      HOME: $SNAP_USER_COMMON
      DISABLE_WAYLAND: 1
  cli:
    command: bin/groestlcoin-cli
    plugs: [home,removable-media, network]
    environment:
      HOME: $SNAP_USER_COMMON
  tx:
    command: bin/groestlcoin-tx
    environment:
      HOME: $SNAP_USER_COMMON
  wallet:
    command: bin/groestlcoin-wallet
    plugs: [home, removable-media]
    environment:
      HOME: $SNAP_USER_COMMON
  util:
    command: bin/groestlcoin-util
    environment:
      HOME: $SNAP_USER_COMMON

parts:
  desktop-launch:
    source: ./snap/local/src
    plugin: make
    stage-packages:
      - libxkbcommon0
      - fonts-ubuntu
      - dmz-cursor-theme
      - light-themes
      - adwaita-icon-theme
      - gnome-themes-standard
      - shared-mime-info
      - libqt5gui5
      - libgdk-pixbuf2.0-0
      - libqt5svg5 # for loading icon themes which are svg
      - locales-all
      - xdg-user-dirs
      - fcitx-frontend-qt5

  groestlcoin-core:
    plugin: nil
    override-build: |
      env | grep "CRAFT\|SNAP" | sort
      groestlcoin_core_version=$(craftctl get version)
      curl --fail --location --remote-name https://github.com/Groestlcoin/groestlcoin/releases/download/v${groestlcoin_core_version}/SHA256SUMS
      curl --fail --location --remote-name https://github.com/Groestlcoin/groestlcoin/releases/download/v${groestlcoin_core_version}/groestlcoin-${groestlcoin_core_version}.tar.gz
      curl --fail --location --remote-name https://github.com/Groestlcoin/groestlcoin/releases/download/v${groestlcoin_core_version}/groestlcoin-${groestlcoin_core_version}-${CRAFT_ARCH_TRIPLET_BUILD_FOR}.tar.gz
      echo "c9d8cc4400d8fc32502c8eb9ab43c06f1eec5f8605d147ae75bef0b0a4d65b00  SHA256SUMS" | sha256sum --check
      sha256sum --ignore-missing --check SHA256SUMS
      tar -xvf groestlcoin-${groestlcoin_core_version}-${CRAFT_ARCH_TRIPLET_BUILD_FOR}.tar.gz
      tar -xvf groestlcoin-${groestlcoin_core_version}.tar.gz
      install -m 0755 -D -t $CRAFT_PART_INSTALL/bin groestlcoin-${groestlcoin_core_version}/bin/groestlcoind
      install -m 0755 -D -t $CRAFT_PART_INSTALL/bin groestlcoin-${groestlcoin_core_version}/bin/groestlcoin-qt
      install -m 0755 -D -t $CRAFT_PART_INSTALL/bin groestlcoin-${groestlcoin_core_version}/bin/groestlcoin-cli
      install -m 0755 -D -t $CRAFT_PART_INSTALL/bin groestlcoin-${groestlcoin_core_version}/bin/groestlcoin-tx
      install -m 0755 -D -t $CRAFT_PART_INSTALL/bin groestlcoin-${groestlcoin_core_version}/bin/groestlcoin-wallet
      install -m 0755 -D -t $CRAFT_PART_INSTALL/bin groestlcoin-${groestlcoin_core_version}/bin/groestlcoin-util
      curl --fail --location --remote-name https://raw.githubusercontent.com/groestlcoin/groestlcoin/v${groestlcoin_core_version}/share/pixmaps/groestlcoin128.png
      install -m 0644 -D -t $CRAFT_PART_INSTALL/share/pixmaps groestlcoin128.png
    build-packages:
      - curl
    after:
      - desktop-launch
